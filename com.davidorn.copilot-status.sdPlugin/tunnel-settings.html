<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Remote tunnel</title>
    <style>
        :root { color-scheme: dark; font: 13px "Segoe UI", sans-serif; }
        body { margin: 12px; color: #e7e7e7; background: #2d2d2d; }
        fieldset { display: grid; gap: 8px; margin: 0; padding: 0; border: 0; }
        legend { margin-bottom: 8px; padding: 0; font-weight: 600; }
        p { margin: 0; }
        .buttons { display: flex; flex-wrap: wrap; gap: 6px; }
        button, input, select { font: inherit; color: inherit; border: 1px solid #737373; border-radius: 4px; background: #383838; padding: 5px 8px; }
        input, select { box-sizing: border-box; width: 100%; min-width: 0; }
        button:enabled { cursor: pointer; }
        button:disabled { opacity: .55; }
        button[type="submit"]:enabled { background: #154e82; }
        :focus-visible { outline: 2px solid #85c6ff; outline-offset: 1px; }
        #notice { color: #c8c8c8; }
        [hidden] { display: none; }
    </style>
</head>
<body>
    <form>
        <fieldset disabled>
            <legend>Remote tunnel</legend>
            <p>Use the account that shared the tunnel.</p>
            <div class="buttons">
                <button id="microsoft" type="button">Sign in with Microsoft (Entra)</button>
                <button id="github" type="button">Sign in with GitHub</button>
                <button id="find" type="button">Find tunnels</button>
                <button id="cancel-sign-in" type="button" hidden>Cancel sign-in</button>
            </div>
            <label id="tunnel-picker" hidden>
                Available tunnels
                <select id="tunnels"></select>
            </label>
            <label>
                Tunnel ID
                <input id="tunnel-id" type="text" pattern="[A-Za-z0-9][A-Za-z0-9.\-]{0,126}" required maxlength="127" spellcheck="false" autocomplete="off">
            </label>
            <div class="buttons">
                <button id="connect" type="submit" disabled>Connect</button>
                <button id="disconnect" type="button" disabled>Disconnect</button>
            </div>
            <p id="status" role="status">Loading tunnel settings…</p>
            <p id="notice" role="status" hidden></p>
        </fieldset>
    </form>
    <script src="tunnel-settings.js"></script>
</body>
</html>
