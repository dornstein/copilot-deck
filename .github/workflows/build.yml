name: Build Stream Deck plugin

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  PLUGIN_DIR: com.davidorn.copilot-status.sdPlugin
  INSTALLER: dist/com.davidorn.copilot-status.streamDeckPlugin

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Install plugin dependency
        run: npm.cmd ci --prefix "$env:PLUGIN_DIR" --omit=optional --ignore-scripts
      - name: Test
        run: node --test tests/*.test.cjs
      - name: Check release version
        if: github.ref_type == 'tag'
        run: |
          $manifest = Get-Content "$env:PLUGIN_DIR/manifest.json" -Raw | ConvertFrom-Json
          if ($env:GITHUB_REF_NAME -cne "v$($manifest.Version)") {
            throw "Expected tag v$($manifest.Version) to match the plugin manifest."
          }
      - name: Rebuild the bundled profile
        run: python scripts/build-profile.py
      - name: Package the installer
        run: |
          npm.cmd exec --yes --package=@elgato/cli@1.10.3 -- streamdeck pack "$env:PLUGIN_DIR" --output dist --no-update-check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path -LiteralPath $env:INSTALLER -PathType Leaf)) {
            throw "Stream Deck CLI did not produce $env:INSTALLER."
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: copilot-deck-windows
          path: ${{ env.INSTALLER }}
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: copilot-deck-windows
          path: dist
      - name: Publish the installer on GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" "$INSTALLER" --verify-tag --generate-notes
